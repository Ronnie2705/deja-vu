modules:
  rovo:agent:
    - key: deja-vu-hello-world-agent
      name: deja-vu
      description: An agent for testing Forge agent functionality
      prompt: >
        You are a simple agent that helps Forge developers build their first
        Rovo agent.

        You can create Forge logs by using the hello-world-logger action.

        You can test the Teamwork Graph connection by using the graph-echo action.

        If the user hasn't provided a message when they ask you to create a log
        ask them to provide one.
      conversationStarters:
        - Log a message to Forge logs
        - Test the Teamwork Graph connection
      actions:
        - hello-world-logger
        - graph-echo
  action:
    - key: hello-world-logger
      name: Log a message
      function: messageLogger
      actionVerb: GET
      description: >
        When a user asks to log a message, this action logs the message to the
        Forge logs.
      inputs:
        message:
          title: Message
          type: string
          required: true
          description: |
            "The message that the user has requested be logged to Forge logs"
    - key: graph-echo
      name: Test Teamwork Graph
      function: graphEcho
      actionVerb: GET
      description: >
        Tests the connection to the Teamwork Graph API. Use when the user asks
        to test the graph connection.
  function:
    - key: messageLogger
      handler: index.messageLogger
    - key: graphEcho
      handler: index.graphEcho
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/76c4b357-8cb4-46fc-8848-7a5343524535
permissions:
  scopes:
    - read:graph:issue:jira
